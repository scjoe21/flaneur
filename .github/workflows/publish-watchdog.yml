name: 발행 감시견

# ── 왜 필요한가 (2026-08-29 사고) ──
# GitHub의 예약(cron) 실행은 "정시 보장"이 없고, 부하가 심하면 몇 시간씩 밀린다.
# 게다가 **같은 워크플로**의 예약 이벤트가 아직 대기 중이면 뒤따르는 예약은 아예 버려진다.
# 2026-08-28이 그 사례였다:
#   - 피드 자동 수집  cron 04:00 UTC → 실제 시작 15:50 UTC (+11h50m)
#   - 주간 자동 발행  cron 15:09 UTC → 실제 시작 23:59 UTC (+8h50m)
#   - 주간 자동 발행  cron 18:37 UTC → 실행 자체가 없음(앞 예약이 대기 중이라 폐기)
# 결과: 토요일 00:09 KST에 나와야 할 18편이 09:23 KST에야 올라왔다.
# curate.yml 안에 백업 cron을 아무리 더 넣어도 같은 큐에 들어가 함께 밀리거나 버려진다.
#
# ── 해결 ──
# 예약 큐가 분리되도록 **별도 워크플로**로 매시간 지켜본다.
# 매 시각 data/news.json이 목표 주차(다음 월요일 주)를 18편으로 채웠는지 확인하고,
# 아니면 curate.yml을 workflow_dispatch로 깨운다.
# 기회가 4번 → 약 26번으로 늘어, 몇 시간짜리 지연이 나도 토요일 안에 복구된다.
# curate.py는 멱등적이라(같은 주차 18편이면 건너뜀) 중복 실행은 무해하다.

on:
  schedule:
    # UTC 기준. curate.yml 1차 예약(금 15:09 UTC = 토 00:09 KST)에 1시간 반 여유를 준 뒤부터
    # 최종 안전망(일 17:11 UTC = 월 02:11 KST)까지 매시간.
    - cron: '41 16-23 * * 5'   # 금 16:41~23:41 UTC (토 01:41~08:41 KST)
    - cron: '41 * * * 6'       # 토 종일 (토 09:41 KST ~ 일 08:41 KST)
    - cron: '41 0-17 * * 0'    # 일 00:41~17:41 UTC (일 09:41 KST ~ 월 02:41 KST)
  workflow_dispatch:

concurrency:
  group: publish-watchdog
  cancel-in-progress: false

jobs:
  check:
    name: 이번 주 발행 여부 확인 → 필요하면 발행 트리거
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write      # curate.yml을 workflow_dispatch로 깨우기 위해 필요

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # curate.py의 get_week_info()/멱등성 판정과 같은 규칙으로 목표 주차를 계산한다.
      # (언제 돌든 "다음 월요일"이 속한 ISO 주차, 목표 편수 18)
      - name: 목표 주차 대비 발행 상태 확인
        id: status
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone, timedelta

          WEEKLY_TARGET = 18

          now = datetime.now(timezone.utc)
          days_to_next_monday = (7 - now.weekday()) % 7 or 7
          next_monday = (now + timedelta(days=days_to_next_monday)).date()
          year, week, _ = next_monday.isocalendar()
          target = f"{year}-W{week:02d}"

          try:
              d = json.load(open("data/news.json", encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              d = {}
          current = d.get("week")
          count = len(d.get("items", []))

          done = current == target and count >= WEEKLY_TARGET
          print(f"target={target}")
          print(f"current={current}")
          print(f"count={count}")
          print(f"done={'true' if done else 'false'}")
          PY

      - name: 상태 출력
        run: |
          echo "목표 주차: ${{ steps.status.outputs.target }}"
          echo "현재 news.json: ${{ steps.status.outputs.current }} (${{ steps.status.outputs.count }}편)"
          echo "발행 완료 여부: ${{ steps.status.outputs.done }}"

      # 이미 curate.yml이 돌고 있거나 대기 중이면 중복 트리거하지 않는다.
      - name: 실행 중인 발행 잡 확인
        if: steps.status.outputs.done == 'false'
        id: running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/curate.yml/runs?per_page=20" \
                --jq '[.workflow_runs[]
                       | select(.status=="queued" or .status=="pending"
                                or .status=="waiting" or .status=="in_progress")] | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "진행/대기 중인 주간 자동 발행: ${n}건"

      - name: 발행 트리거
        if: steps.status.outputs.done == 'false' && steps.running.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::${{ steps.status.outputs.target }} 미발행(현재 ${{ steps.status.outputs.current }} ${{ steps.status.outputs.count }}편) — 예약이 밀렸거나 폐기됐습니다. 주간 자동 발행을 수동 트리거합니다."
          gh workflow run curate.yml -f reason="발행 감시견 — 예약 지연 복구"
