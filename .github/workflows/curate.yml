name: 주간 자동 발행

on:
  schedule:
    # ── 신뢰도 설계: 사람이 토요일마다 확인하지 않아도 되도록 ──
    # GitHub 예약 cron은 부하 시(특히 UTC 자정 직후) 자주 스킵됨.
    # 그래서 "다음 주(월~금)" 한 주차를 목표로 금→토→일 3일에 걸쳐 분산 트리거한다.
    # get_week_info()는 금/토/일 어느 날 실행돼도 "다음 월요일" 주차를 계산하므로
    # 모두 동일한 주를 발행하며, curate.py 멱등성으로 이미 발행됐으면 자동 건너뜀.
    # → 하루치 예약이 통째로 스킵돼도 다음 날이 자동 복구. 3일 연속 스킵 확률 ≈ 0.
    # cron 요일/시각은 UTC 기준(금=5, 토=6, 일=0). 정시(:00) 혼잡을 피해 오프셋 분 사용.
    - cron: '9 15 * * 5'    # 토 00:09 KST (금 15:09 UTC) — 1차 (토요일 0시 KST)
    - cron: '37 18 * * 5'   # 토 03:37 KST (금 18:37 UTC) — 같은 날 백업
    - cron: '23 16 * * 6'   # 일 01:23 KST (토 16:23 UTC) — +1일 안전망
    - cron: '11 17 * * 0'   # 월 02:11 KST (일 17:11 UTC) — +2일 최종 안전망
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 사유 (선택)'
        required: false
        default: '수동 실행'
      force:
        description: '이미 발행된 주차여도 강제 재생성'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# 분산 트리거/수동 실행이 겹쳐도 한 번에 하나만 실행 (push 경합 방지).
# 대기 중인 실행은 취소하지 않음 — 멱등성 덕에 순서대로 돌아도 안전(이미 발행됐으면 건너뜀).
concurrency:
  group: weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 피드 수집 → AI 큐레이션 → 발행
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install anthropic

      - name: 피드 수집
        continue-on-error: true
        run: python scripts/fetch_feeds.py

      - name: AI 큐레이션
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python scripts/curate.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name  "flaneur-bot"
          git config user.email "bot@flaneur.kr"
          git add data/feeds/ data/news.json data/published_history.json
          git diff --cached --quiet || \
            git commit -m "주간 자동 발행 — $(date -u '+%Y-%m-%d')"
          git pull --rebase -X ours origin master
          git push

      # 발행 편수 검증: 18개 미만이면 잡을 실패로 표시(가시화) → 다음 cron 안전망이 이어서 보충.
      # 아울러 (a) 요일(나라)별 정확히 3개인지, (b) 한 주 안에서 같은 철학자가 두 번 이상
      # 쓰이지 않았는지, (c) 최근 몇 주 이력과 철학자가 겹치지 않는지를 검증한다.
      # 진행분은 이미 커밋/푸시됐으므로 유실되지 않는다.
      - name: 발행 편수·요일 배분·철학자 유일성 검증 (18개 = 6일×3개)
        run: |
          python - <<'PY'
          import json, sys, re
          d = json.load(open("data/news.json", encoding="utf-8"))
          items = d.get("items", [])
          from collections import Counter
          by_day = Counter(it.get("day") for it in items)
          print(f"발행 주차: {d.get('week')} / 총 {len(items)}개")
          DAYS = ["monday","tuesday","wednesday","thursday","friday","saturday"]
          for day in DAYS:
              print(f"  {day}: {by_day.get(day,0)}")

          # 요일(나라)별 정확히 3개 — 특정 나라가 4~5개가 되면 안 된다
          over  = [f"{d_}={by_day.get(d_,0)}" for d_ in DAYS if by_day.get(d_,0) > 3]
          under = [f"{d_}={by_day.get(d_,0)}" for d_ in DAYS if by_day.get(d_,0) < 3]
          if over:
              print("::error::요일당 3개 초과: " + ", ".join(over))
          if under:
              print("::warning::요일당 3개 미달: " + ", ".join(under))

          # 일본(토요일) '그 나라 맥락'이 한국어인지 — 일본어 문자가 섞이면 경고
          JP = re.compile("[ぁ-ゟ゠-ヿ]")
          jp_bad = [it.get("title") for it in items
                    if it.get("day") == "saturday" and JP.search(it.get("detail",""))]
          if jp_bad:
              print("::warning::토요일 본문에 일본어 문자 발견(한국어로 써야 함): " + ", ".join(map(str, jp_bad)))

          # 철학자 유일성 검사 (성 기준 정규화)
          STOP = {"the","von","van","der","den","de","del","della","di","le","la","of","el","dos","da","san","saint"}
          def keys(field):
              ks=set()
              for part in re.split(r"[/,;·&]| 그리고 ", field or ""):
                  part=part.strip()
                  if not part: continue
                  m=re.search(r"[(（]([^)）]*)[)）]", part)
                  latin=m.group(1) if m else part
                  toks=[t.lower() for t in re.findall(r"[A-Za-z][A-Za-z'\-]+", latin)]
                  toks=[t for t in toks if len(t)>=3 and t not in STOP]
                  if toks: ks.add(toks[-1])
                  else:
                      kk=re.sub(r"[\s·]+","",part)
                      if kk: ks.add(kk)
              return ks
          seen={}; dups=[]
          for it in items:
              for k in keys(it.get("philosopher","")):
                  if k in seen:
                      dups.append(f"{k}: '{seen[k]}' ↔ '{it.get('title')}'")
                  else:
                      seen[k]=it.get("title")
          if dups:
              print("::warning::같은 주에 철학자 중복 발견:\n  " + "\n  ".join(dups))

          # 최근 이력과의 철학자 중복(크로스위크) — 경고만. 3차 보충에서 완화되므로 실패는 아님.
          try:
              hist = json.load(open("data/published_history.json", encoding="utf-8"))["weeks"]
              past = set()
              for e in hist[-11:]:
                  if e.get("week") == d.get("week"):
                      continue
                  for a in e.get("articles", []):
                      for f in [a.get("philosopher","")] + (a.get("philosophers") or []):
                          past |= keys(f)
              repeats = [f"{it.get('philosopher')} — '{it.get('title')}'"
                         for it in items if keys(it.get("philosopher","")) & past]
              if repeats:
                  print(f"::warning::최근 10주에 다룬 철학자 재등장 {len(repeats)}건:\n  "
                        + "\n  ".join(repeats))
          except Exception as e:
              print(f"이력 대조 건너뜀: {e}")

          if over:
              print("::error::나라별 편수 규칙 위반(요일당 3개 초과) — curate.py MAX_PER_DAY 확인 필요")
              sys.exit(1)
          if len(items) < 18:
              print(f"::error::주간 발행 편수 부족: {len(items)}/18 — 다음 cron이 보충합니다.")
              sys.exit(1)
          print("✓ 18개(6일 × 3개) 발행 확인")
          PY
