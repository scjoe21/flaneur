name: 주간 자동 발행

on:
  schedule:
    # GitHub schedule cron은 부하 시 자주 스킵됨(특히 UTC 자정 직후 혼잡 구간).
    # 토요일 0시 KST 시작 = 금요일 15시 UTC — UTC 자정 피크를 피해 신뢰도 향상.
    # 3회 분산 트리거 + curate.py 멱등성으로 이미 발행된 주차는 자동 건너뜀.
    # cron의 요일은 UTC 기준이므로 금요일(=5). 정시(:00) 혼잡을 피해 오프셋 분 사용.
    - cron: '9 15 * * 5'   # 00:09 KST 토 (15:09 UTC 금) — 1차
    - cron: '37 16 * * 5'  # 01:37 KST 토 (16:37 UTC 금) — 백업
    - cron: '19 18 * * 5'  # 03:19 KST 토 (18:19 UTC 금) — 백업
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 사유 (선택)'
        required: false
        default: '수동 실행'
      force:
        description: '이미 발행된 주차여도 강제 재생성'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  publish:
    name: 피드 수집 → AI 큐레이션 → 발행
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install anthropic

      - name: 피드 수집
        continue-on-error: true
        run: python scripts/fetch_feeds.py

      - name: AI 큐레이션
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python scripts/curate.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name  "flaneur-bot"
          git config user.email "bot@flaneur.kr"
          git add data/feeds/ data/news.json data/published_history.json
          git diff --cached --quiet || \
            git commit -m "주간 자동 발행 — $(date -u '+%Y-%m-%d')"
          git pull --rebase -X ours origin master
          git push
