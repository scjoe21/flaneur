name: 주간 자동 발행

on:
  schedule:
    # GitHub schedule cron은 부하 시 자주 스킵됨. 토요일 오전 3회 분산 트리거
    # + curate.py 멱등성으로 이미 발행된 주차는 자동 건너뜀
    - cron: '13 0 * * 6'   # 09:13 KST (00:13 UTC) — 1차
    - cron: '47 1 * * 6'   # 10:47 KST (01:47 UTC) — 백업
    - cron: '23 3 * * 6'   # 12:23 KST (03:23 UTC) — 백업
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 사유 (선택)'
        required: false
        default: '수동 실행'
      force:
        description: '이미 발행된 주차여도 강제 재생성'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  publish:
    name: 피드 수집 → AI 큐레이션 → 발행
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install anthropic

      - name: 피드 수집
        continue-on-error: true
        run: python scripts/fetch_feeds.py

      - name: AI 큐레이션
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python scripts/curate.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name  "flaneur-bot"
          git config user.email "bot@flaneur.kr"
          git add data/feeds/ data/news.json
          git diff --cached --quiet || \
            git commit -m "주간 자동 발행 — $(date -u '+%Y-%m-%d')"
          git pull --rebase -X ours origin master
          git push
