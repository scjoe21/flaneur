<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flâneur — 철학적 일상의 기록</title>
  <meta name="description" content="일상과 철학이 만나는 곳. 월요일부터 금요일까지, 소스에서 수집된 이번 주 소식.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── 헤더 ── -->
<header class="site-header">
  <div class="container">
    <button class="site-logo" id="logo-btn">
      <span class="site-logo__kr">Flâneur</span>
    </button>

    <nav class="site-nav" id="nav-main">
      <a href="essay.html" class="nav-link nav-icon-btn nav-link--essay" data-tooltip="에세이">◎</a>
      <button id="nav-saved" class="nav-link nav-icon-btn" data-tooltip="저장함">★</button>
    </nav>
  </div>
</header>

<!-- ══════════════════════════════════════════
     주간 피드 (초기 화면)
══════════════════════════════════════════ -->
<div id="feed-view">

  <!-- 히어로 -->
  <section class="hero">
    <div class="container">
      <div class="hero__week" id="hero-week"></div>
      <h1 class="hero__theme" id="hero-theme"></h1>
      <p class="hero__sub">월요일부터 금요일까지, 소스에서 수집된 이번 주 소식입니다.</p>
      <div class="hero__meta">
        <span class="hero__count" id="hero-count"></span>
        <button class="saved-badge" id="saved-badge" style="display:none">
          <span>★</span><span>저장한 내용</span>
          <span class="count">0</span><span>개</span>
        </button>
      </div>
    </div>
  </section>

  <main>
    <div class="container">
      <!-- 요일 탭 -->
      <div class="day-tabs">
        <div class="day-tabs__list" id="day-tabs"></div>
      </div>

      <!-- 뉴스 그리드 -->
      <section class="news-section">
        <div class="news-grid" id="news-grid">
          <div class="empty-state">
            <div class="empty-state__icon">⏳</div>
            <div class="empty-state__text">소식을 불러오는 중입니다…</div>
          </div>
        </div>
      </section>

    </div>
  </main>

</div><!-- /feed-view -->


<!-- ── 뉴스 모달 ── -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-meta">
      <span class="modal-day"></span>
      <span style="color:var(--border)">·</span>
      <span class="modal-source"></span>
    </div>
    <h2 class="modal-title"></h2>
    <div class="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn--primary" id="modal-source-btn">원문 보기 →</button>
      <button class="btn btn--ghost" onclick="document.getElementById('modal-overlay').classList.remove('open');document.body.style.overflow=''">닫기</button>
    </div>
  </div>
</div>

<!-- ── 구절 저장 툴팁 ── -->
<div class="clip-tooltip" id="clip-tooltip" style="display:none">
  <button id="clip-save-btn">✦ 구절 저장</button>
</div>

<!-- ── 저장함 패널 ── -->
<aside class="saved-panel" id="saved-panel">
  <div class="saved-panel__header">
    <h2 class="saved-panel__title">저장한 내용</h2>
    <button class="modal-close" id="saved-panel-close">✕</button>
  </div>
  <div class="saved-panel__body" id="saved-panel-body">
    <div class="saved-empty">아직 저장한 내용이 없습니다.</div>
  </div>
  <div class="saved-panel__footer">
    <a href="saved.html" class="btn btn--outline" style="width:100%;justify-content:center">저장 목록 전체 보기</a>
  </div>
</aside>

<!-- ── 푸터 ── -->
<footer class="site-footer">
  <div class="container">
    <p class="footer-copy">© 2026 Flâneur. 철학적 일상의 기록.</p>
    <nav class="footer-nav">
      <a href="essay.html">에세이 전체</a>
    </nav>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/main.js"></script>
</body>
</html>
